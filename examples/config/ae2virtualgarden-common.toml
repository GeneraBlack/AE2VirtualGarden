#     requireAeEnergy = false
#     energyPerDrop = 0.0
#   [tiers]
#     tier1kDrops = 1
#     tier4kDrops = 4
#     tier16kDrops = 16
#     tier64kDrops = 64
#     tier256kDrops = 256
# ==============================================================================