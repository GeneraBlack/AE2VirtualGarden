#     tier4kDrops = 8
#     tier16kDrops = 32
#     tier64kDrops = 128
#     tier256kDrops = 512
#
# PRESET 2: "Hardcore / High Tech / Heavy Power"
#   Ideal for expert / greg-style / tech-heavy progression packs:
#   [general]
#     baseTickInterval = 100     # Generates drops every 5 seconds
#     requireAeEnergy = true
#     energyPerDrop = 50.0       # Requires substantial power infrastructure
#   [tiers]
#     tier1kDrops = 1
#     tier4kDrops = 2
#     tier16kDrops = 8
#     tier64kDrops = 32
#     tier256kDrops = 128
#
# PRESET 3: "Free Energy / Creative / Sandbox"
#   No energy needed, standard rates:
